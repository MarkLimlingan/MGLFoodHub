<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D2B4E" />
    <meta name="robots" content="noindex" />
    <title>No internet · MGL Food Hub</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #fbf4ea;
        color: #0d2b4e;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; display: grid; gap: 14px; justify-items: center; }
      .brand { font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
      .brand span { color: #e57f07; }
      h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.25; }
      p { margin: 0; color: rgba(13, 43, 78, 0.7); line-height: 1.5; }
      button {
        margin-top: 6px;
        border: 0;
        border-radius: 999px;
        padding: 12px 26px;
        background: #f7941d;
        color: #0d2b4e;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">MGL <span>Food Hub</span></div>
      <h1>No internet connection</h1>
      <p>Check your mobile data or WiFi, then try again. Your cart is saved on this phone.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
